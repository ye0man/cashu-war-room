name: Publish War Room

on:
  workflow_run:
    workflows: ["Daily Cashu War Room Report"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'reports/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Remove stale Pages artifacts
        if: github.run_attempt > 1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name == "github-pages") | .id' |
          while read -r artifact_id; do
            [ -n "$artifact_id" ] || continue
            echo "Deleting stale artifact ${artifact_id}"
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
          done

      - name: Upload report artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: reports

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
